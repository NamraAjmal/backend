services:
  api:
    build: .
    ports: ["8000:3000"]
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
    depends_on: [db]

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    volumes:
      - taskdata:/var/lib/postgresql

volumes:
  taskdata:
